[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cutzo"
version = "0.1.0"
description = "Streamlined podcast and video editing for The Dig and The New Heretics, with a Claude connector."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "mcp>=2.3,<3",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cutzo-engine = "cutzo.engine:main"
cutzo-connector = "cutzo.mcp_server:main"

[project.gui-scripts]
cutzo = "cutzo.launcher:main"

[tool.setuptools.packages.find]
include = ["cutzo*"]

[tool.setuptools.package-data]
cutzo = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
